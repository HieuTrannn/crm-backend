version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: sqlc
        out: db/sqlc
        sql_package: pgx/v5
        emit_json_tags: true
        emit_interface: true
        emit_pointers_for_null_types: true
        overrides:
          # IDs are UUID v7 generated in Go with google/uuid.
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: NullUUID
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
