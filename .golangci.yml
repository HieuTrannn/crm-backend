version: "2"

run:
  # Also lint the integration tests behind //go:build integration.
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
  exclusions:
    rules:
      # Tests build request cookies, which carry no Secure/HttpOnly/SameSite attributes.
      - path: _test\.go
        linters: [gosec]
        text: G124

formatters:
  enable:
    - gofmt
    - goimports
